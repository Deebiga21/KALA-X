                plate: gl.getUniformLocation(glassProg, "uPlate"), plateFit: gl.getUniformLocation(glassProg, "uPlateFit"), hasPlate: gl.getUniformLocation(glassProg, "uHasPlate"),
                env: gl.getUniformLocation(glassProg, "uEnv"), sdf: gl.getUniformLocation(glassProg, "uSDF"),
                rot: gl.getUniformLocation(glassProg, "uRot"), rotT: gl.getUniformLocation(glassProg, "uRotT"), center: gl.getUniformLocation(glassProg, "uCenter"),
                scale: gl.getUniformLocation(glassProg, "uScale"), boundR: gl.getUniformLocation(glassProg, "uBoundR"), shape: gl.getUniformLocation(glassProg, "uShape"),
                halfDepth: gl.getUniformLocation(glassProg, "uHalfDepth"), bevel: gl.getUniformLocation(glassProg, "uBevel"), torusTube: gl.getUniformLocation(glassProg, "uTorusTube"),
                logoHalf: gl.getUniformLocation(glassProg, "uLogoHalf"), sdfUnits: gl.getUniformLocation(glassProg, "uSdfUnits"),
                disp: gl.getUniformLocation(glassProg, "uDisp"), frost: gl.getUniformLocation(glassProg, "uFrost"), tint: gl.getUniformLocation(glassProg, "uTint"),
            };
            const aGlassPos = gl.getAttribLocation(glassProg, "aPos");
            const quadBuf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

            function makeTex(wrap) {
                const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0])); return t;
            }
            const plateTex = makeTex(gl.CLAMP_TO_EDGE); const sdfTex = makeTex(gl.CLAMP_TO_EDGE); const envTex = makeTex(gl.REPEAT);

            const envCanvas = buildEnvCanvas();
            if (envCanvas) { gl.bindTexture(gl.TEXTURE_2D, envTex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, 0); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, envCanvas); }

            let vw = 1, vh = 1;
            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const w = Math.max(1, Math.round(window.innerWidth * dpr)); const h = Math.max(1, Math.round(window.innerHeight * dpr));
                vw = w; vh = h; canvas.width = w; canvas.height = h;
            }
            window.addEventListener('resize', resize); resize();

            gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
            gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.clearColor(0, 0, 0, 0);

            let baseYaw = 0, basePitch = 0;
            let prev = performance.now(), elapsed = 0;

            function frame(now) {
                requestAnimationFrame(frame);
                const dt = Math.min((now - prev) / 1000, 0.05); prev = now; elapsed += dt;

                const speed = 100;
                baseYaw += (speed / 50) * SPIN_YAW * dt; basePitch += (speed / 50) * SPIN_PITCH * dt;

                const yaw = baseYaw; const pitch = Math.max(-1.45, Math.min(1.45, basePitch)) + 100 * DEG;
                const rot = rotYXZ(yaw, pitch, 0); const rotT = transpose3(rot);

                const camDist = CAM_DIST; const halfFrame = camDist * Math.tan(FOV / 2); const targetHalf = Math.max(0.02, 60 / 100) * halfFrame;
                const nativeDepth = Math.max(0, 32 / 100); const torusTube = Math.max(0.02, nativeDepth * 0.5);
                
                // Shape = Torus (1)
                const shapeId = 1; const refHalf = 0.8 + torusTube; const boundR = 0.8 + torusTube;
                const halfDepth = nativeDepth * 0.5; const bevel = BEVEL; const logoHalfX = 1; const logoHalfY = 1;

                const scale = targetHalf / refHalf; const floatY = Math.sin(elapsed * 2) * IDLE_FLOAT;
                const screenAspect = vw / vh; const fitX = 1; const fitY = 1;

                gl.viewport(0, 0, vw, vh); gl.clear(gl.COLOR_BUFFER_BIT);
                gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);

                gl.useProgram(glassProg);
                gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, plateTex); gl.uniform1i(u.plate, 0);
                gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, envTex); gl.uniform1i(u.env, 1);
                gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, sdfTex); gl.uniform1i(u.sdf, 2);

                gl.uniform2f(u.res, vw, vh); gl.uniform1f(u.aspect, screenAspect); gl.uniform1f(u.tanHalf, Math.tan(FOV / 2));
                gl.uniform2f(u.plateFit, fitX, fitY); gl.uniform1f(u.hasPlate, 0);
                gl.uniformMatrix3fv(u.rot, false, rot); gl.uniformMatrix3fv(u.rotT, false, rotT);
                gl.uniform3f(u.center, 0, floatY, -camDist); gl.uniform1f(u.scale, scale); gl.uniform1f(u.boundR, boundR);
                gl.uniform1f(u.shape, shapeId); gl.uniform1f(u.halfDepth, halfDepth); gl.uniform1f(u.bevel, bevel);
                gl.uniform1f(u.torusTube, torusTube); gl.uniform2f(u.logoHalf, logoHalfX, logoHalfY); gl.uniform1f(u.sdfUnits, 1.0);
                
                gl.uniform1f(u.disp, 25 / 1000); gl.uniform1f(u.frost, 50 / 100); gl.uniform3f(u.tint, 1, 1, 1);
                gl.enableVertexAttribArray(aGlassPos); gl.vertexAttribPointer(aGlassPos, 2, gl.FLOAT, false, 0, 0);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }
            requestAnimationFrame(frame);
        };
    </script>
